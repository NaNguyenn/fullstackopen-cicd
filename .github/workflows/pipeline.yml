name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  simple_deployment_pipeline:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run eslint
      - name: Run tests
        run: npm test
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Build project
        run: npm run build
      - name: Mock deployment
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        run: echo "Deployed successfully!"
  tag_release:
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bump version and push tag
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
  discord_notification:
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Log pipeline result
        env:
          PIPELINE_RESULT: ${{ needs.simple_deployment_pipeline.result }}
        run: echo "$PIPELINE_RESULT"
      - name: Send Discord success notification
        uses: sarisia/actions-status-discord@v1
        if: ${{ needs.simple_deployment_pipeline.result == 'success' && github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          content: "Deployment Successful! A new version deployed to production"
          title: "Deployment Details"
          description: |
            - Commit: ${{ github.sha }}
            - Message: ${{ github.event.head_commit.message }}
            - Author: ${{ github.event.head_commit.author.name }}
          color: 22bb33
      - name: Send Discord failure notification
        uses: sarisia/actions-status-discord@v1
        if: ${{ needs.simple_deployment_pipeline.result == 'failure' && github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          content: "Build Failed! The pipeline encountered an error."
          title: "Failure Details"
          description: |
            - Repository: ${{ github.repository }}
            - Branch: ${{ github.ref }}
            - Commit: ${{ github.sha }}
            - Message: ${{ github.event.head_commit.message }}
            - Author: ${{ github.event.head_commit.author.name }}
            - Workflow: ${{ github.workflow }}
            - Job: ${{ github.job }}
          color: ff0000
